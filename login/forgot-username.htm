<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot your username</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --orange:#e35205;
      --orange-dark:#cf4900;
      --bg:#f3f3f3;
      --text:#1f1f1f;
      --muted:#6f6f6f;
      --border:#c9c9c9;
      --line:#d5d5d5;
      --disabled:#a9a9a9;
      --cancel-bg:#f1dfd7;
      --cancel-text:#c24a16;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Inter",Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    /* Header */
    .topbar{
      background:#000;
      height:60px;
      display:flex;
      align-items:center;
    }
    .topbar-inner{
      width:100%;
      max-width:1200px;
      margin:0 auto;
      padding:0 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .realme-logo{
      display:flex;
      align-items:center;
      gap:12px;
      color:#fff;
    }
    .realme-mark{
      width:30px;
      height:30px;
      border-radius:50%;
      background:#fff;
      position:relative;
      flex-shrink:0;
    }
    .realme-mark::before{
      content:"";
      position:absolute;
      width:8px;
      height:8px;
      border-radius:50%;
      background:#000;
      left:7px;
      top:7px;
    }
    .realme-mark::after{
      content:"";
      position:absolute;
      width:8px;
      height:14px;
      border-radius:4px;
      background:#000;
      right:7px;
      top:8px;
    }
    .realme-text{
      line-height:1;
    }
    .realme-text .brand{
      font-size:18px;
      font-weight:700;
      letter-spacing:-0.02em;
    }
    .realme-text .sub{
      font-size:10px;
      color:#d8d8d8;
      margin-top:3px;
    }

    .nz-logo{
      color:#fff;
      text-align:right;
      line-height:1.05;
      font-size:11px;
      font-weight:700;
      letter-spacing:0.02em;
    }
    .nz-logo .top{
      font-size:13px;
    }

    /* Back bar */
    .backbar{
      background:#e9e9e9;
      border-bottom:1px solid #d8d8d8;
    }
    .backbar-inner{
      max-width:1200px;
      margin:0 auto;
      padding:12px 24px;
    }
    .backlink{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:#3f3f3f;
      text-decoration:none;
      font-size:12px;
      font-weight:500;
    }
    .back-icon{
      width:16px;
      height:16px;
      border:1px solid #666;
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:10px;
      line-height:1;
    }

    /* Main */
    .page{
      max-width:1200px;
      margin:0 auto;
      padding:28px 24px 48px;
    }
    .form-wrap{
      width:100%;
      max-width:680px;
    }

    h1{
      margin:0 0 10px;
      font-size:26px;
      font-weight:300;
      color:var(--orange);
    }

    .rule{
      border:none;
      border-top:1px solid var(--line);
      margin:0 0 16px;
    }

    .intro{
      font-size:11px;
      line-height:1.45;
      color:#333;
      margin-bottom:22px;
    }

    .field{
      margin-bottom:10px;
    }

    .radio-group{
      margin-bottom:12px;
    }
    .radio-option{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:11px;
      margin-bottom:6px;
      cursor:pointer;
    }
    .radio-option input{
      margin:0;
    }

    .input{
      width:100%;
      height:34px;
      border:1px solid var(--border);
      border-radius:8px;
      padding:0 12px;
      font-size:12px;
      background:#fff;
    }
    .input:focus{
      outline:none;
      border-color:#8a8a8a;
      box-shadow:0 0 0 2px rgba(227,82,5,.08);
    }

    .btn{
      height:28px;
      border:none;
      border-radius:8px;
      padding:0 14px;
      font-size:11px;
      font-weight:600;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn-primary{
      background:var(--orange);
      color:#fff;
    }
    .btn-primary:hover{
      background:var(--orange-dark);
    }

    .btn-icon{
      width:14px;
      height:14px;
      border-radius:50%;
      background:#fff;
      color:var(--orange);
      display:grid;
      place-items:center;
      font-size:9px;
      font-weight:700;
      line-height:1;
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top:18px;
      flex-wrap:wrap;
    }

    .btn-cancel{
      background:var(--cancel-bg);
      color:var(--cancel-text);
      min-width:120px;
    }

    .btn-cancel .btn-icon{
      background:#fff;
      color:var(--cancel-text);
    }

    /* Responsive */
    @media (max-width:768px){
      .topbar{height:72px}
      .topbar-inner{
        padding:0 16px;
      }
      .page{
        padding:22px 16px 40px;
      }
      .form-wrap{
        max-width:none;
      }
      h1{
        font-size:30px;
      }
      .actions{
        flex-direction:column;
      }
      .btn{
        width:100%;
        justify-content:center;
        height:40px;
        font-size:13px;
      }
    }

    @media (max-width:480px){
      .realme-text .brand{font-size:16px}
      .nz-logo{font-size:10px}
      .nz-logo .top{font-size:12px}
      h1{font-size:26px}
      .input{height:40px;font-size:13px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="realme-logo">
        <div class="realme-mark"></div>
        <div class="realme-text">
          <div class="brand">RealMe</div>
          <div class="sub">Tēnei Au</div>
        </div>
      </div>

      <div class="nz-logo">
        <div class="top">NEW ZEALAND</div>
        <div>IMMIGRATION</div>
      </div>
    </div>
  </header>

  <div class="backbar">
    <div class="backbar-inner">
      <a href="/login" class="backlink">
        <span class="back-icon">←</span>
        Go back to login
      </a>
    </div>
  </div>

  <main class="page">
    <div class="form-wrap">
      <h1>Forgot your username</h1>
      <hr class="rule">

      <div class="intro">
        Confirm your email or text mobile number and we will send you an email with your username.
      </div>

      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="contact-method" value="email" checked>
          Send email
        </label>
        <label class="radio-option">
          <input type="radio" name="contact-method" value="text">
          Text message
        </label>
      </div>

      <div class="field">
        <input class="input" type="text" placeholder="Email Address">
      </div>

      <div class="actions">
        <button class="btn btn-primary" type="button">
          <span class="btn-icon">→</span>
          Send Code
        </button>

        <button class="btn btn-cancel" type="button" onclick="location.href='/login'">
          <span class="btn-icon">×</span>
          Cancel
        </button>
      </div>
    </div>
  </main>
</body>
</html>
