services:
  - type: web
    name: immigration-portal
    runtime: node
    repo: https://github.com/your-username/immigration
    branch: main
    plan: starter
    buildCommand: npm install --production=false
    startCommand: node server.js
    autoDeploy: yes
    rootDir: .
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: STORAGE_FORCE_IN_MEMORY
        value: "true"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
    healthCheckPath: /healthz
    domains: []
