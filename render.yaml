services:
  - type: web
    name: immigration-portal
    runtime: node
    repo: https://github.com/your-username/immigration
    branch: main
    plan: starter
    buildCommand: npm install --production=false
    startCommand: node server.js
    autoDeploy: yes
    rootDir: .
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: RENDER_DISK_ROOT
        value: /opt/render/project/portal-data
      - key: LOCAL_DATABASE_FILE
        value: /opt/render/project/portal-data/data/portal-db.json
      - key: DOCUMENT_UPLOAD_DIR
        value: /opt/render/project/portal-data/uploads/documents
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
    disks:
      - name: portal-data
        mountPath: /opt/render/project/portal-data
        sizeGB: 10
    healthCheckPath: /healthz
    domains: []
